name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# Runs what this repository publishes: the interface, the foundation layers of
# the engine, and the dependency audit.  The decoding core and its test suite
# (round-trip oracle, no-egress run, container smoke test) join with the final
# release.

jobs:
  frontend:
    name: interface build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: No runtime CDN references
        # The interface must load on a machine that has never been online.
        run: |
          if grep -rhoE "(src|href)=\"https?://" shruti/web/static/ ; then
            echo "built bundle references an external origin"; exit 1
          fi
          echo "no external origins in the built bundle"

  engine:
    name: published engine layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e .
      - name: Byte-compile every published module
        run: python -m compileall -q shruti
      - name: Import the foundation layers
        run: |
          python - <<'PY'
          import shruti.core.bits, shruti.core.gf2, shruti.core.stats
          import shruti.cartridge, shruti.l0_container
          import shruti.l4_twin.modulation, shruti.l4_twin.shaping
          import shruti.l6_fec.gf256, shruti.l6_fec.interleave, shruti.l6_fec.scramble
          print("foundation layers import cleanly")
          PY

  licences:
    name: licence audit (no GPL, no LGPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e ".[gui]" pip-licenses
      - name: Fail on any copyleft dependency
        # A deliberately permissive dependency tree is what lets an adopter
        # fork privately and ship without publishing, so it is enforced here
        # rather than merely documented.
        run: |
          pip-licenses --format=json > licences.json
          python - <<'PY'
          import json, sys
          bad = []
          for p in json.load(open("licences.json")):
              lic = (p.get("License") or "").upper()
              if "GPL" in lic:
                  bad.append((p["Name"], p["License"]))
          if bad:
              print("copyleft dependencies found:")
              for n, l in bad:
                  print(f"  {n}: {l}")
              sys.exit(1)
          print("licence audit clean: no GPL, no LGPL")
          PY
      - uses: actions/upload-artifact@v4
        with: { name: licences, path: licences.json }

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e ".[gui]" cyclonedx-bom
      - name: Generate CycloneDX SBOM with pinned hashes
        run: cyclonedx-py environment -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cdx.json }
